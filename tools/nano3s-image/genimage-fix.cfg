flash spinand-256M {
	pebsize = 131072
	lebsize = 126976
	numpebs = 2048
	minimum-io-unit-size = 2048
	vid-header-offset = 2048
	sub-page-size = 2048
}

image app.ubifs {
	ubifs {
		extraargs = "-x zlib -U"
		space-fixup = true
	}
	size = 10M
	mountpoint = "app"
	flashtype = "spinand-256M"
}

image app.ubi {
	ubi {
		extraargs = ""
		minimize = true
	}
	partition ubi_app_part {
		image = "app.ubifs"
		autoresize = true
	}
	size = 12M
	flashtype = "spinand-256M"
}

image data.ubifs {
	ubifs {
		extraargs = "-x zlib -U"
		space-fixup = true
	}
	size = 51298304
	mountpoint = "data"
	flashtype = "spinand-256M"
}

image data.ubi {
	ubi {
		extraargs = ""
		minimize = true
	}
	partition ubi_data_part {
		image = "data.ubifs"
		autoresize = true
	}
	size = 56M
	flashtype = "spinand-256M"
}
